# budget: 850
# One page of a team's open issues that are not in progress (triage, backlog
# and unstarted), for triage health, stale issues and the open-issue trend.
# Pages hold 100 issues; the client follows `endCursor` for at most 10 pages.
query TeamOpenIssues($teamId: String!, $after: String) {
  team(id: $teamId) {
    issues(first: 100, after: $after, filter: { state: { type: { in: ["triage", "backlog", "unstarted"] } } }) {
      nodes {
        id
        identifier
        title
        description
        url
        branchName
        priority
        estimate
        labelIds
        createdAt
        updatedAt
        startedAt
        completedAt
        canceledAt
        triagedAt
        team {
          id
          key
          name
          issueEstimationType
        }
        state {
          id
          name
          type
          position
        }
        assignee {
          id
          name
          displayName
        }
        creator {
          id
          name
          displayName
        }
        cycle {
          id
          number
          name
          startsAt
          endsAt
          completedAt
        }
        project {
          id
        }
      }
      pageInfo {
        hasNextPage
        endCursor
      }
    }
  }
}
