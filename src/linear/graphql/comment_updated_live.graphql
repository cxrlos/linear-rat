# budget: 5
# Every comment edited, resolved or reacted to in the workspace, with what the comments query reads,
# for live updates. Linear offers no filter here, so comments on anything but
# an issue are dropped by the client.
subscription CommentUpdatedLive {
  commentUpdated {
    id
    body
    createdAt
    editedAt
    resolvedAt
    parentId
    reactions {
      id
      emoji
      createdAt
      user {
        id
      }
    }
    issueId
    user {
      id
      name
      displayName
    }
  }
}
