# budget: 270
# One page of an issue's workflow state history, each span with its state,
# and the issue's project, project milestone, first 50 attachments and its
# own reactions. Pages hold 50 spans. The client follows `endCursor` until
# `hasNextPage` is false, sorts them oldest first and takes the attachments
# and reactions from the first page.
query IssueStateHistory($id: String!, $after: String) {
  issue(id: $id) {
    id
    project {
      id
      name
    }
    projectMilestone {
      id
      name
      project {
        id
      }
    }
    reactions {
      id
      emoji
      createdAt
      user {
        id
      }
    }
    attachments(first: 50) {
      nodes {
        id
        url
        title
        subtitle
        sourceType
        metadata
      }
    }
    stateHistory(first: 50, after: $after) {
      nodes {
        stateId
        startedAt
        endedAt
        state {
          id
          name
          type
          position
          team {
            id
          }
        }
      }
      pageInfo {
        hasNextPage
        endCursor
      }
    }
  }
}
