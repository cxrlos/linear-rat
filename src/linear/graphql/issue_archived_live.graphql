# budget: 15
# Every issue archived in the workspace, with the fields the delta poll
# reads, for live updates. Linear offers no team filter here, so issues of
# teams lrat did not subscribe to are dropped by the client.
subscription IssueArchivedLive {
  issueArchived {
    id
    identifier
    title
    description
    url
    branchName
    priority
    estimate
    labelIds
    createdAt
    updatedAt
    startedAt
    completedAt
    canceledAt
    triagedAt
    trashed
    team {
      id
      key
      name
      issueEstimationType
    }
    state {
      id
      name
      type
      position
    }
    assignee {
      id
      name
      displayName
    }
    creator {
      id
      name
      displayName
    }
    cycle {
      id
      number
      name
      startsAt
      endsAt
      completedAt
    }
    project {
      id
    }
    projectMilestone {
      id
    }
    parent {
      id
    }
    dueDate
    archivedAt
    subscribers(first: 1, filter: { isMe: { eq: true } }) {
      nodes {
        id
      }
    }
  }
}
