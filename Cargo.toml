[package]
name = "linear-rat"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "A fast, keyboard-first terminal client for Linear"
repository = "https://github.com/cxrlos/linear-rat"
homepage = "https://github.com/cxrlos/linear-rat"
license = "MIT OR Apache-2.0"
keywords = ["linear", "tui", "terminal", "ratatui", "issue-tracker"]
categories = ["command-line-utilities"]

[[bin]]
name = "lrat"
path = "src/main.rs"

# Points cargo-binstall at the archives dist attaches to the GitHub release.
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ target }{ archive-suffix }"
bin-dir = "{ name }-{ target }/{ bin }{ binary-ext }"
pkg-fmt = "txz"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
crossterm = { version = "0.29.0", features = ["event-stream"] }
etcetera = "0.11.0"
futures-util = { version = "0.3.34", default-features = false, features = ["alloc"] }
jiff = { version = "0.2.38", features = ["serde"] }
pulldown-cmark = { version = "0.13.4", default-features = false }
keyring-core = "1.0.1"
nucleo-matcher = "0.3.1"
ratatui = "0.30.2"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls"] }
rpassword = "7.5.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.53.3", features = ["macros", "rt", "signal", "time"] }
toml = { version = "1.1.8", default-features = false, features = ["std", "parse"] }
toml_parser = { version = "1.1.5", default-features = false, features = ["std"] }
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
unicode-width = "0.2.2"

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "1.0.2", features = ["keychain"] }

[target.'cfg(target_os = "linux")'.dependencies]
dbus-secret-service-keyring-store = { version = "1.0.1", features = ["crypto-rust", "vendored"] }

[dev-dependencies]
apollo-compiler = "1.33.1"
insta = "1.49.0"
tokio = { version = "1.53.3", features = ["net", "test-util"] }
wiremock = "0.6.5"

[lints.clippy]
expect_used = "deny"
unwrap_used = "deny"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
