name: Schema drift

# Validates every GraphQL document against Linear's latest published schema,
# so drift shows up before someone refreshes the pinned copy. The pinned
# src/linear/schema.graphql is never changed here.
on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: schema-drift
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  schema-drift:
    name: schema drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install stable --profile minimal
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Download Linear's latest schema
        run: >-
          curl --fail --silent --show-error --location --retry 3
          --output "$RUNNER_TEMP/schema.graphql"
          https://raw.githubusercontent.com/linear/linear/HEAD/packages/sdk/src/schema.graphql
      - name: Validate the documents
        id: validate
        continue-on-error: true
        env:
          LRAT_SCHEMA_PATH: ${{ runner.temp }}/schema.graphql
        run: >-
          cargo test --locked --test graphql_schema every_document_is_valid_and_within_its_budget
          2>&1 | tee "$RUNNER_TEMP/output.txt"
      # One open issue tracks the drift: found by its exact title, commented on
      # by later failures, and left alone once closed.
      - name: Open or update the drift issue
        if: steps.validate.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TITLE: 'Schema drift: GraphQL documents fail against the latest Linear schema'
        run: |
          failing=$(grep -m1 '^failing documents:' "$RUNNER_TEMP/output.txt" \
            || echo 'failing documents: none listed; the build failed or the schema did not parse, see the output')
          {
            echo "The weekly check against Linear's latest [schema.graphql](https://github.com/linear/linear/blob/HEAD/packages/sdk/src/schema.graphql) failed in [this run]($RUN_URL)."
            echo
            echo "$failing"
            echo
            echo '<details><summary>Test output</summary>'
            echo
            echo '```'
            tail -c 60000 "$RUNNER_TEMP/output.txt"
            echo '```'
            echo
            echo '</details>'
          } > "$RUNNER_TEMP/body.md"
          number=$(gh issue list --state open --limit 1000 --json number,title \
            --jq 'map(select(.title == env.TITLE)) | .[0].number // empty')
          if [ -n "$number" ]; then
            gh issue comment "$number" --body-file "$RUNNER_TEMP/body.md"
          else
            gh issue create --title "$TITLE" --label needs-triage --body-file "$RUNNER_TEMP/body.md"
          fi
          exit 1
