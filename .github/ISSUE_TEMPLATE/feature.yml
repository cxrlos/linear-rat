name: Feature request
description: Suggest something lrat should do
labels: [enhancement, needs-triage]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
  - type: textarea
    id: linear-concepts
    attributes:
      label: Linear concepts involved
      description: Issues, cycles, projects, views, inbox... Use the terms in GLOSSARY.md where they apply.
