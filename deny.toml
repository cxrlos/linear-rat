[graph]
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
]
all-features = true

[advisories]
yanked = "deny"
unmaintained = "all"
unsound = "all"
ignore = [
    # pulldown-cmark wikilinks parse in exponential and quadratic time. lrat
    # never sets ENABLE_WIKILINKS (src/ui/markdown.rs). Drop both once the
    # fixed 0.13.6 has been out two weeks.
    { id = "RUSTSEC-2026-0414", reason = "lrat never enables pulldown-cmark wikilinks" },
    { id = "RUSTSEC-2026-0433", reason = "lrat never enables pulldown-cmark wikilinks" },
]

[licenses]
# One license per line, sorted, so parallel additions merge cleanly.
allow = [
    "Apache-2.0",
    "BSD-3-Clause",
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Zlib",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
