[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.32.0"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["shell", "homebrew"]
# A GitHub repo to push Homebrew formulas to
tap = "cxrlos/homebrew-tap"
# Publish jobs to run in CI
publish-jobs = ["homebrew"]
# Target platforms to build apps for (Rust target-triple syntax)
targets = ["aarch64-apple-darwin", "aarch64-unknown-linux-gnu", "x86_64-apple-darwin", "x86_64-unknown-linux-gnu"]
# Path that installers should place binaries in
install-path = "CARGO_HOME"
# Whether to install an updater program
install-updater = false
# Create the GitHub Release in the host job, once, after every artifact is built
github-release = "host"
# Pin release.yml's actions to commits. dist writes "name@value", so the text
# after the hash becomes the version comment in the YAML.
github-action-commits = { "actions/checkout" = "3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1", "actions/upload-artifact" = "cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2", "actions/download-artifact" = "9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2" }

# dist 0.32 builds aarch64-apple-darwin on macos-14 by default, which GitHub
# has retired; build it on the current Apple silicon image instead.
[dist.github-custom-runners]
aarch64-apple-darwin = "macos-15"
